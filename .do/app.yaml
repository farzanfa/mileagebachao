# DigitalOcean App Platform spec for OctaneFinder.
# Region blr = Bangalore (BLR1) — India data residency is mandatory (memo A.7/A.15).
# Create with: doctl apps create --spec .do/app.yaml   (then set SECRET envs in the dashboard)
name: octanefinder
region: blr

services:
  - name: web
    environment_slug: node-js
    github:
      repo: your-org/octanefinder # <-- set to your repo
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 3000
    instance_size_slug: basic-xxs # ~$5/mo; bump to basic-xs at scale
    instance_count: 1
    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 20
      period_seconds: 15
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        scope: RUN_AND_BUILD_TIME
        value: "" # set to your Stadia/MapTiler style URL to enable the live map
      - key: NEXT_PUBLIC_MAP_ATTRIBUTION
        scope: RUN_AND_BUILD_TIME
        value: "© OpenStreetMap contributors"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${octane-db.DATABASE_URL}
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_GOOGLE_ID
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_GOOGLE_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: ""
      - key: S3_ENDPOINT
        scope: RUN_TIME
        value: "" # DO Spaces endpoint, e.g. https://blr1.digitaloceanspaces.com
      - key: S3_BUCKET
        scope: RUN_TIME
        value: ""
      - key: S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET

databases:
  - name: octane-db
    engine: PG
    version: "16"
    production: false # flip to true (and size up) for production; enable the PostGIS extension
