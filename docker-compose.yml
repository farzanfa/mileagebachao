# OctaneFinder — local / self-host stack (BUILD-CONTRACT §11 DEVOPS slice).
#
#   db       PostgreSQL 16 + PostGIS 3.4 (matches prod: DO Managed PG16, BLR1)
#   migrate  one-shot — applies SQL migrations then seeds reference + station data,
#            then exits (Compose `service_completed_successfully` gate below)
#   app      Next.js standalone server (reads DB; falls back to seed JSON if DB down)
#
# Usage:
#   docker compose up --build         # db → migrate (runs once) → app on :3000
#   docker compose run --rm migrate   # re-run migrate+seed on demand (idempotent)
#
# Credentials/URLs default to the dev values in .env.example and can be overridden
# via a local .env file (Compose auto-loads it) or the shell environment.

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-octane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octane}
  POSTGRES_DB: ${POSTGRES_DB:-octanefinder}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      <<: *db-env
      # Fail fast on an empty password instead of trusting all connections.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Exposed for local psql / tooling; not required by the other services.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octane} -d ${POSTGRES_DB:-octanefinder}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://octane:octane@db:5432/octanefinder}
      NODE_ENV: production
    # CMD in the migrator stage is `npm run migrate && npm run seed`.

  app:
    build:
      context: .
      target: runner
      args:
        # NEXT_PUBLIC_* must be baked at build time to reach the client bundle.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://octane:octane@db:5432/octanefinder}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
      NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
      # Optional secrets (auth, S3, admin) — supply via .env / shell to enable those features.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      - "${APP_PORT:-3000}:3000"
    # The image already declares a HEALTHCHECK (node fetch → /api/v1/health).

volumes:
  pgdata:
